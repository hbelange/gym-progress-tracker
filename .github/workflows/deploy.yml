name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build
        run: ./mvnw -B package

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy jar and restart service
        run: |
          scp -i ~/.ssh/deploy_key target/GymProgressTracker-0.0.1-SNAPSHOT.jar ec2-user@${{ secrets.EC2_HOST }}:~/app/gym-progress-tracker.jar
          ssh -i ~/.ssh/deploy_key ec2-user@${{ secrets.EC2_HOST }} 'sudo systemctl restart gym-progress-tracker'
