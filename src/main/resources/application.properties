spring.application.name=GymProgressTracker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/gym_tracker}
spring.datasource.username=${DB_USERNAME:gym_user}
spring.datasource.password=${DB_PASSWORD:gym_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# SSL
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${SSL_KEYSTORE_PATH:classpath:certificate.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

# Secret key for JWT signing (Base64 encoded, 256-bit). No default on purpose:
# the app must fail to start rather than silently sign tokens with a
# well-known value. Tests supply their own value via
# src/test/resources/application.properties.
jwt.secret=${JWT_SECRET}

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL used to build links in verification/password-reset emails
app.base-url=${APP_BASE_URL:https://localhost:8080}