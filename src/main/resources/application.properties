spring.application.name=GymProgressTracker

spring.datasource.url=jdbc:postgresql://localhost:5434/gym_tracker
spring.datasource.username=gym_user
spring.datasource.password=gym_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# SSL
server.ssl.key-store-type:PKCS12
server.ssl.key-store:classpath:certificate.p12
server.ssl.key-store-password:Xc&ndtrack605