<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
    <h1>Forgot Password</h1>

    <p class="message message-success" th:if="${param.sent}">If that email is registered, a password reset link is on its way.</p>
    <p class="message message-error" th:if="${error}" th:text="${error}"></p>

    <form class="auth-form" th:action="@{/forgot-password}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <button type="submit">Send Reset Link</button>
    </form>

    <p><a th:href="@{/login}">Back to login</a></p>
</body>
</html>
