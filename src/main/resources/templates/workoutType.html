<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workout Types - Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="page-header">
        <a class="back" href="/">&larr; Home</a>
        <h1>Workout Types</h1>
    </header>

    <div class="status-card">
        <form id="workoutType-form">
            <input id="workoutType-name" type="text" placeholder="Workout type name" maxlength="100" required />
            <button type="submit">Add</button>
        </form>
        <ul id="workoutType-list"></ul>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        async function loadWorkoutTypes() {
            const res = await fetch('/api/workoutType');
            const workoutTypes = await res.json();
            const list = document.getElementById('workoutType-list');
            list.innerHTML = workoutTypes.map(w => `
                <li id="workoutType-${w.id}">
                    <span>${w.name}</span>
                    <button class="edit" onclick="startEdit(${w.id}, '${w.name}')">Edit</button>
                    <button class="delete" onclick="deleteWorkoutType(${w.id})">Delete</button>
                </li>`).join('');
        }

        function startEdit(id, currentName) {
            const li = document.getElementById(`workoutType-${id}`);
            li.innerHTML = `
                <input type="text" value="${currentName}" maxlength="100" id="edit-input-${id}" />
                <button class="save" onclick="saveEdit(${id})">Save</button>
                <button class="edit" onclick="loadWorkoutTypes()">Cancel</button>`;
        }

        async function saveEdit(id) {
            const name = document.getElementById(`edit-input-${id}`).value.trim();
            await fetch(`/api/workoutType/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify({ name })
            });
            loadWorkoutTypes();
        }

        async function deleteWorkoutType(id) {
            await fetch(`/api/workoutType/${id}`, {
                method: 'DELETE',
                headers: { [csrfHeader]: csrfToken }
            });
            loadWorkoutTypes();
        }

        document.getElementById('workoutType-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('workoutType-name').value.trim();
            await fetch('/api/workoutType', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify({ name })
            });
            document.getElementById('workoutType-name').value = '';
            loadWorkoutTypes();
        });

        loadWorkoutTypes();
    </script>
</body>
</html>
