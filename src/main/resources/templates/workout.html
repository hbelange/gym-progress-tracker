<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Workouts - Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="page-header">
        <a class="back" href="/">&larr; Home</a>
        <h1>Workouts</h1>
    </header>

    <div class="nav">
        <a th:href="@{/workout(year=${prevYear}, month=${prevMonth})}">&larr;</a>
        <strong th:text="${monthLabel}"></strong>
        <a th:href="@{/workout(year=${nextYear}, month=${nextMonth})}">&rarr;</a>
    </div>

    <table class="calendar">
        <thead>
            <tr>
                <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="week : ${weeks}">
                <td th:each="day : ${week}" th:attr="data-date=${day}" th:classappend="${day != null and day.equals(today)} ? 'today' : ''">
                    <a th:if="${day != null}" th:href="@{/workout/{date}(date=${day})}" th:text="${day.dayOfMonth}"></a>
                </td>
            </tr>
        </tbody>
    </table>

    <script>
        async function colorDays() {
            const workoutsRes = await fetch('/api/workouts');
            const workouts = await workoutsRes.json();

            const cells = document.querySelectorAll('td[data-date]');
            const visibleDates = new Set(Array.from(cells).map(td => td.dataset.date));
            const workoutsByDate = new Map(workouts.filter(w => visibleDates.has(w.date)).map(w => [w.date, w]));

            const setCounts = await Promise.all(
                Array.from(workoutsByDate.values()).map(async w => {
                    const res = await fetch(`/api/workouts/${w.id}/sets`);
                    const sets = await res.json();
                    return [w.date, sets.length];
                })
            );
            const setCountByDate = new Map(setCounts);

            cells.forEach(td => {
                const date = td.dataset.date;
                if (!workoutsByDate.has(date)) {
                    td.classList.add('day-empty');
                } else if ((setCountByDate.get(date) || 0) > 0) {
                    td.classList.add('day-complete');
                } else {
                    td.classList.add('day-partial');
                }
            });
        }

        colorDays();
    </script>
</body>
</html>
