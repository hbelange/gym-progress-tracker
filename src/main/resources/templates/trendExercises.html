<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lift Trends - Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="page-header">
        <a class="back" href="/">&larr; Home</a>
        <h1>Trends</h1>
    </header>

    <div class="tabs">
        <a th:href="@{/trend/measurements}">Measurements</a>
        <a class="active" th:href="@{/trend/exercises}">Lifts</a>
    </div>

    <ul id="lift-list"></ul>

    <script>
        async function loadExercises() {
            const res = await fetch('/api/trend/exercises');
            const exercises = await res.json();
            const list = document.getElementById('lift-list');
            list.innerHTML = exercises.map(e => `
                <li>
                    <a href="/trend/exercises/${e.exerciseId}">
                        <span>${e.exerciseName}</span>
                        <span class="last-set">${e.lastWorkoutDate}</span>
                    </a>
                </li>`).join('');
        }

        loadExercises();
    </script>
</body>
</html>
