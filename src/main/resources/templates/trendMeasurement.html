<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trends - Gym Progress Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="page-header">
        <a class="back" href="/">&larr; Home</a>
        <h1>Trends</h1>
    </header>

    <div class="tabs">
        <a class="active" th:href="@{/trend/measurements}">Measurements</a>
        <a th:href="@{/trend/exercises}">Lifts</a>
    </div>

    <div class="toggle">
        <a th:classappend="${type.name() == 'WEIGHT'} ? 'active' : ''" th:href="@{/trend/measurements(type='WEIGHT', range=${range})}">Body Weight</a>
        <a th:classappend="${type.name() == 'STEPS'} ? 'active' : ''" th:href="@{/trend/measurements(type='STEPS', range=${range})}">Steps</a>
        <a th:classappend="${type.name() == 'CALORIES'} ? 'active' : ''" th:href="@{/trend/measurements(type='CALORIES', range=${range})}">Calories</a>
    </div>

    <div class="toggle">
        <a th:classappend="${range.name() == 'WEEK'} ? 'active' : ''" th:href="@{/trend/measurements(type=${type}, range='WEEK')}">Week</a>
        <a th:classappend="${range.name() == 'MONTH'} ? 'active' : ''" th:href="@{/trend/measurements(type=${type}, range='MONTH')}">Month</a>
    </div>

    <canvas id="seriesChart"></canvas>
    <canvas id="weeklyChart"></canvas>

    <script th:inline="javascript">
        const trendType = /*[[${type}]]*/ 'WEIGHT';
        const trendRange = /*[[${range}]]*/ 'WEEK';

        Chart.defaults.color = '#D6D6D6';
        Chart.defaults.borderColor = 'rgba(214, 214, 214, 0.16)';
        Chart.defaults.font.family = "'Public Sans', sans-serif";

        async function loadTrend() {
            const res = await fetch(`/api/trend/measurements?type=${trendType}&range=${trendRange}`);
            const data = await res.json();

            new Chart(document.getElementById('seriesChart'), {
                type: 'line',
                data: {
                    labels: data.series.map(p => p.date),
                    datasets: [{
                        label: trendType,
                        data: data.series.map(p => p.value),
                        borderColor: '#FFD100',
                        backgroundColor: 'rgba(255, 209, 0, 0.15)',
                        pointBackgroundColor: '#FFD100',
                        tension: 0.25
                    }]
                }
            });

            const weeklyValues = data.weeklyAverages.map(w => w.average);
            const weeklyMin = weeklyValues.length ? Math.min(...weeklyValues) * 0.7 : undefined;
            new Chart(document.getElementById('weeklyChart'), {
                type: 'bar',
                data: {
                    labels: data.weeklyAverages.map(w => w.weekStart),
                    datasets: [{
                        label: 'Weekly Average',
                        data: weeklyValues,
                        backgroundColor: '#FFD100'
                    }]
                },
                options: {
                    scales: { y: { min: weeklyMin } }
                }
            });
        }

        loadTrend();
    </script>
</body>
</html>
