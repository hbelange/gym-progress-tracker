<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="page-header">
        <h1>Gym Progress Tracker</h1>
        <p class="dashboard-lede">Log the work. Watch the trend.</p>
    </header>

    <nav class="dashboard-grid">
        <a href="/workout">
            <span class="label">Workouts</span>
            <span class="hint">Log sets, reps, weight</span>
        </a>
        <a href="/measurement">
            <span class="label">Measurements</span>
            <span class="hint">Weight, steps, calories</span>
        </a>
        <a href="/trend">
            <span class="label">Trends</span>
            <span class="hint">Progress over time</span>
        </a>
        <a href="/exercise">
            <span class="label">Exercises</span>
            <span class="hint">Manage your library</span>
        </a>
        <a href="/workoutType">
            <span class="label">Workout Types</span>
            <span class="hint">Push, pull, legs...</span>
        </a>
    </nav>
</body>
</html>
