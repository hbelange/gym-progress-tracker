<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercises - Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="page-header">
        <a class="back" href="/">&larr; Home</a>
        <h1>Exercises</h1>
    </header>

    <div class="status-card">
        <form id="exercise-form">
            <input id="exercise-name" type="text" placeholder="Exercise name" maxlength="100" required />
            <button type="submit">Add</button>
        </form>
        <ul id="exercise-list"></ul>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        async function loadExercises() {
            const res = await fetch('/api/exercise');
            const exercises = await res.json();
            const list = document.getElementById('exercise-list');
            list.innerHTML = exercises.map(e => `
                <li id="exercise-${e.id}">
                    <span>${e.name}</span>
                    <button class="edit" onclick="startEdit(${e.id}, '${e.name}')">Edit</button>
                    <button class="delete" onclick="deleteExercise(${e.id})">Delete</button>
                </li>`).join('');
        }

        function startEdit(id, currentName) {
            const li = document.getElementById(`exercise-${id}`);
            li.innerHTML = `
                <input type="text" value="${currentName}" maxlength="100" id="edit-input-${id}" />
                <button class="save" onclick="saveEdit(${id})">Save</button>
                <button class="edit" onclick="loadExercises()">Cancel</button>`;
        }

        async function saveEdit(id) {
            const name = document.getElementById(`edit-input-${id}`).value.trim();
            await fetch(`/api/exercise/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify({ name })
            });
            loadExercises();
        }

        async function deleteExercise(id) {
            await fetch(`/api/exercise/${id}`, {
                method: 'DELETE',
                headers: { [csrfHeader]: csrfToken }
            });
            loadExercises();
        }

        document.getElementById('exercise-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('exercise-name').value.trim();
            await fetch('/api/exercise', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify({ name })
            });
            document.getElementById('exercise-name').value = '';
            loadExercises();
        });

        loadExercises();
    </script>
</body>
</html>
