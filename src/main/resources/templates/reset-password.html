<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
    <h1>Reset Password</h1>

    <p class="message message-error" th:if="${error}" th:text="${error}"></p>
    <p class="message message-error" th:if="${param.error}" th:text="${param.error}"></p>

    <form class="auth-form" th:if="${error == null}" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}" />

        <label for="password">New Password</label>
        <input type="password" id="password" name="password" required />

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required />

        <button type="submit">Reset Password</button>
    </form>

    <p th:if="${error}"><a th:href="@{/forgot-password}">Request a new reset link</a></p>
    <p><a th:href="@{/login}">Back to login</a></p>
</body>
</html>
