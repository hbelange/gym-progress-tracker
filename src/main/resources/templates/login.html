<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
    <h1>Login</h1>

    <p class="message message-error" th:if="${param.error}">Invalid username or password.</p>
    <p class="message message-success" th:if="${param.verified}">Verification successful. Please log in.</p>

    <div th:if="${param.unverified}">
        <p class="message message-error">Please verify your email before logging in.</p>
        <form th:action="@{/resend-verification}" method="post">
            <input type="hidden" name="username" th:value="${param.username}" />
            <button type="submit">Resend verification email</button>
        </form>
    </div>

    <form class="auth-form" th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a th:href="@{/register}">Register</a></p>
</body>
</html>
