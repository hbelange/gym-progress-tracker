<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exercise Trend - Gym Progress Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="page-header">
        <a class="back" href="/trend/exercises">&larr; Lifts</a>
        <h1>Exercise Trend</h1>
    </header>

    <div class="toggle">
        <a th:classappend="${range.name() == 'WEEK'} ? 'active' : ''" th:href="@{/trend/exercises/{id}(id=${exerciseId}, range='WEEK')}">Week</a>
        <a th:classappend="${range.name() == 'MONTH'} ? 'active' : ''" th:href="@{/trend/exercises/{id}(id=${exerciseId}, range='MONTH')}">Month</a>
    </div>

    <canvas id="seriesChart"></canvas>
    <canvas id="weeklyChart"></canvas>

    <script th:inline="javascript">
        const exerciseId = /*[[${exerciseId}]]*/ 0;
        const trendRange = /*[[${range}]]*/ 'WEEK';

        async function loadTrend() {
            const res = await fetch(`/api/trend/exercises/${exerciseId}?range=${trendRange}`);
            const data = await res.json();

            new Chart(document.getElementById('seriesChart'), {
                type: 'line',
                data: {
                    labels: data.series.map(p => p.date),
                    datasets: [{
                        label: 'Estimated 1RM',
                        data: data.series.map(p => p.e1rm),
                        borderColor: '#2C423F',
                        backgroundColor: 'rgba(44, 66, 63, 0.12)',
                        pointBackgroundColor: '#2C423F',
                        tension: 0.25
                    }]
                }
            });

            const weeklyMin = Math.min(...data.weeklyAverages.map(w => w.average));
            new Chart(document.getElementById('weeklyChart'), {
                type: 'bar',
                data: {
                    labels: data.weeklyAverages.map(w => w.weekStart),
                    datasets: [{
                        label: 'Weekly Average',
                        data: data.weeklyAverages.map(w => w.average),
                        backgroundColor: '#4C5B61'
                    }]
                },
                options: {
                    scales: { y: { min: weeklyMin * 0.7 } }
                }
            });
        }

        loadTrend();
    </script>
</body>
</html>
