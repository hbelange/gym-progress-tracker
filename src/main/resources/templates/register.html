<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
    <h1>Register</h1>

    <p class="message message-error" th:if="${error}" th:text="${error}"></p>

    <form class="auth-form" th:action="@{/register}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" th:value="${userRequestDTO.username}" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a th:href="@{/login}">Login</a></p>
</body>
</html>
